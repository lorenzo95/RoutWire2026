# RoutWire2026 / meshd — docker compose deployment
#
#   sudo mkdir -p /etc/meshd
#   sudo MESH_PSK=<psk> docker compose run --rm meshd-init \
#        init -name alpha -out /etc/meshd/meshd.yaml      # first node (prints/joins PSK)
#   sudo docker compose up -d                             # run the node
#
# NOTE on forwarding: net.ipv4.ip_forward CANNOT be set via `sysctls:` here —
# the engine rejects sysctls under network_mode: host (and mounts /proc/sys
# read-only inside containers regardless). If this node serves spokes (NAT),
# enable it once on the HOST:
#
#   echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/99-meshd.conf
#   sudo sysctl --system

services:
  meshd:
    build: .
    image: ghcr.io/lorenzo95/routewire2026:latest
    container_name: meshd
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /etc/meshd:/etc/meshd
    command: ["-config", "/etc/meshd/meshd.yaml"]

  # One-shot enrollment helper (profile 'init' keeps it out of `up`):
  #   sudo MESH_PSK=<psk> docker compose run --rm meshd-init \
  #     init -name beta -out /etc/meshd/meshd.yaml
  meshd-init:
    image: ghcr.io/lorenzo95/routewire2026:latest
    profiles: ["init"]
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /etc/meshd:/etc/meshd
    environment:
      - MESH_PSK=${MESH_PSK:-}
